html,body{width:100%;height:100%;overflow:hidden;background:#1e1e2e;color:#cdd6f4;font-family:'Segoe UI',sans-serif;}
/* 顶部导航 */
header{background:#181825;padding:1rem 1.5rem;border-bottom:1px solid #313244;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;width:100%;}

.lang-tabs{display:flex;gap:0.7rem;flex-wrap:wrap;}
.lang-tab{padding:0.5rem 1rem;border-radius:8px;background:#313244;cursor:pointer;opacity:0.7;transition:all 0.2s ease;}
.lang-tab.active{background:#89b4fa;color:#1e1e2e;opacity:1;transform:scale(1.05);}
.ui-lang-tab{background:#f5c2e7;color:#1e1e2e;opacity:1;}
.reset-btn{background:#f38ba8;color:white;border:none;padding:0.5rem 1rem;border-radius:6px;cursor:pointer;transition:0.2s;}

.stats{font-size:0.95rem;color:#a6e3a1;}
/* 主容器 100%占满剩余高度 */
.container{display:flex;width:100%;height:calc(100vh - 90px);}
/* 左侧学习区 */
.left-panel{width:40%;padding:1.2rem;border-right:1px solid #313244;overflow-y:auto;height:100%;}
.level-nav{display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;max-height:110px;overflow-y:auto;padding-right:0.5rem;}
.level-tag{padding:0.35rem 0.6rem;border-radius:6px;background:#313244;cursor:not-allowed;opacity:0.6;font-size:0.85rem;transition:all 0.2s;}
.level-tag.unlocked{cursor:pointer;opacity:1;}
.level-tag.active{background:#89b4fa;color:#1e1e2e;transform:scale(1.1);}
.level-tag.passed{background:#a6e3a1;color:#1e1e2e;}
.level-content h3{margin-bottom:0.7rem;color:#89b4fa;font-size:1.3rem;}
.knowledge-tag{display:inline-block;padding:0.4rem 0.9rem;background:#f9e2af;color:#1e1e2e;border-radius:6px;font-size:0.9rem;margin:0.6rem 0;font-weight:bold;}
.knowledge-desc{background:#313244;padding:1.1rem;border-radius:10px;margin:1rem 0;line-height:1.9;}
.video-btn{display:none;}
.tips-box,.answer-box{margin:1rem 0;padding:1.1rem;border-radius:10px;background:#313244;}
.tips-box h4,.answer-box h4{margin-bottom:0.7rem;color:#f9e2af;}
.answer-content{display:none;background:#181825;padding:1rem;border-radius:8px;margin-top:0.5rem;color:#a6e3a1;white-space:pre-wrap;font-family:Consolas,monospace;}
/* 右侧代码区 */
.right-panel{width:60%;display:flex;flex-direction:column;height:100%;}
#code-area{flex:1;background:#181825;border:none;color:#cdd6f4;padding:1.5rem;font-size:16px;line-height:1.7;resize:none;outline:none;font-family:'Consolas',monospace;width:100%;}
.control-bar{padding:1rem 1.5rem;background:#181825;border-top:1px solid #313244;display:flex;gap:1rem;flex-wrap:wrap;}
.btn{padding:0.75rem 1.4rem;border:none;border-radius:8px;font-weight:bold;cursor:pointer;transition:0.2s;}
.btn:hover{transform:translateY(-2px);}
.btn-run{background:#89b4fa;color:#1e1e2e;}
.btn-submit{background:#a6e3a1;color:#1e1e2e;}
.btn-hint{background:#f9e2af;color:#1e1e2e;}
.btn-answer{background:#f5c2e7;color:#1e1e2e;}
#output-area{padding:1.5rem;background:#11111b;border-top:1px solid #313244;min-height:120px;overflow-y:auto;}
.success{color:#a6e3a1;}
.error{color:#f38ba8;}
/* 通关弹窗 */
.win-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#1e1e2e;padding:3rem;border-radius:16px;border:2px solid #a6e3a1;z-index:999;display:none;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.5);}
.win-modal h2{color:#a6e3a1;margin-bottom:1rem;}
/* 小屏幕适配 */
@media (max-width:900px){
.container{flex-direction:column;height:auto;overflow-y:auto;}
.left-panel{width:100%;height:auto;border-right:none;border-bottom:1px solid #313244;max-height:50vh;}
.right-panel{width:100%;height:50vh;}
html,body{overflow:auto;}
}

knowledgeDescEn:"This level covers Go language core ability from basic syntax to cloud native development. You can develop high performance backend service after learning.",
desc:"完成对应关卡代码编写，掌握Go高性能开发核心能力",descEn:"Complete code writing task, master Go high performance development ability",
code:`// Level ${levelNum} Code Area`,
hint:"按照Go语法规范完成对应功能实现",hintEn:"Complete function implementation according to Go syntax specification",
answer:"Reference Code",
checkFunc:(c)=>true
}
})
return [...base,...levels]
})()
}

// 全局状态初始化
let currentLang = 'python'
let currentLevel = 0
let currentUILang = 'zh'
let progressMap = JSON.parse(localStorage.getItem('multi_lang_learning_progress_bilingual')||JSON.stringify({
python: new Array(52).fill(false).map((v,i)=>i===0),
c: new Array(52).fill(false).map((v,i)=>i===0),
cpp: new Array(52).fill(false).map((v,i)=>i===0),
java: new Array(52).fill(false).map((v,i)=>i===0),
go: new Array(52).fill(false).map((v,i)=>i===0)
}))

// UI语言切换事件
document.querySelectorAll('.ui-lang-tab').forEach(tab=>{
tab.onclick = ()=>{
document.querySelectorAll('.ui-lang-tab').forEach(t=>t.classList.remove('active'))
tab.classList.add('active')
currentUILang = tab.dataset.uiLang
refreshAllUIText()
openLevel(currentLevel)
document.querySelector('#output-area').innerHTML = `<div class="success">${i18n[currentUILang].switchLangSuccess}${tab.innerText}${i18n[currentUILang].switchLangMode}</div>`
}
})

// 刷新所有界面UI文本
function refreshAllUIText(){
document.getElementById('pageTitle').innerText = i18n[currentUILang].pageTitle
document.getElementById('resetBtn').innerText = i18n[currentUILang].resetBtn
document.getElementById('runBtn').innerText = i18n[currentUILang].runBtn
document.getElementById('submitBtn').innerText = i18n[currentUILang].submitBtn
document.getElementById('hintBtn').innerText = i18n[currentUILang].hintBtn
document.getElementById('answerBtn').innerText = i18n[currentUILang].answerBtn
document.querySelector('.win-modal h2').innerText = i18n[currentUILang].winTitle
document.getElementById('winDesc').innerText = i18n[currentUILang].winDesc
document.getElementById('winConfirmBtn').innerText = i18n[currentUILang].winConfirmBtn
refreshStats()
}

// 编程语言切换事件
document.querySelectorAll('.lang-tab:not(.ui-lang-tab)').forEach(tab=>{
tab.onclick = ()=>{
document.querySelectorAll('.lang-tab:not(.ui-lang-tab)').forEach(t=>t.classList.remove('active'))
tab.classList.add('active')
currentLang = tab.dataset.lang
currentLevel = 0
renderLevelNav()
refreshStats()
openLevel(0)
document.querySelector('#output-area').innerHTML = `<div class="success">${i18n[currentUILang].switchLangSuccess}${tab.innerText}${i18n[currentUILang].switchLangMode}</div>`
}
})

// 页面初始化
document.querySelector('#output-area').innerHTML = `<div class="success">${i18n[currentUILang].initSuccess}</div>`
refreshAllUIText()
renderLevelNav()
openLevel(0)

function refreshStats(){
const progress = progressMap[currentLang]
const passedCount = progress.filter(x=>x).length
document.getElementById('statsInfo').innerText = `${i18n[currentUILang].statsPrefix}${passedCount}${i18n[currentUILang].statsSuffix}`
}

function renderLevelNav(){
const nav = document.getElementById('levelNav')
const progress = progressMap[currentLang]
nav.innerHTML = ''
allLangLevels[currentLang].forEach((l, idx)=>{
const tag = document.createElement('div')
tag.className = `level-tag ${progress[idx]?'unlocked':''} ${idx === currentLevel?'active':''} ${idx>0&&progress[idx-1]?'passed':''}`
tag.innerText = idx+1
tag.title = currentUILang === 'zh' ? l.title : l.titleEn
tag.onclick = ()=>{
if(progress[idx]) openLevel(idx)
}
nav.appendChild(tag)
})
}

function openLevel(idx){
currentLevel = idx
const level = allLangLevels[currentLang][idx]
document.getElementById('levelContent').innerHTML = `
<h3>${currentUILang === 'zh' ? level.title : level.titleEn}</h3>
<span class="knowledge-tag">${currentUILang === 'zh' ? "考察知识点：" : "Knowledge Point: "}${currentUILang === 'zh' ? level.knowledge : level.knowledgeEn}</span>
<div class="knowledge-desc">
<strong>${currentUILang === 'zh' ? "📚 知识点完整文字讲解：" : "📚 Full Knowledge Explanation:"}</strong><br>
${currentUILang === 'zh' ? level.knowledgeDesc : level.knowledgeDescEn}
</div>
<p style="line-height:1.8;margin-bottom:1rem">${currentUILang === 'zh' ? "闯关任务：" : "Challenge Task: "}${currentUILang === 'zh' ? level.desc : level.descEn}</p>
<div class="tips-box">
<h4>${currentUILang === 'zh' ? "💡 闯关提示" : "💡 Challenge Hint"}</h4>
<div id="hintContent" style="display:none;line-height:1.8;">${currentUILang === 'zh' ? level.hint : level.hintEn}</div>
</div>
<div class="answer-box">
<h4>${currentUILang === 'zh' ? "📖 标准答案" : "📖 Standard Answer"}</h4>
<div class="answer-content" id="answerContent">${level.answer}</div>
</div>
`
document.getElementById('code-area').value = level.code
renderLevelNav()
document.getElementById('leftPanel').scrollTop = 0
}

// 按钮事件绑定
document.getElementById('hintBtn').onclick = ()=>{
const hc = document.getElementById('hintContent')
hc.style.display = hc.style.display === 'block' ? 'none' : 'block'
}

document.getElementById('answerBtn').onclick = ()=>{
const ac = document.getElementById('answerContent')
ac.style.display = ac.style.display === 'block' ? 'none' : 'block'
}

document.getElementById('runBtn').onclick = ()=>{
const code = document.getElementById('code-area').value
document.getElementById('output-area').innerHTML = `<div class="success">${i18n[currentUILang].checkSuccess}${code.length}${i18n[currentUILang].checkSuccessSuffix}</div>`
}

document.getElementById('submitBtn').onclick = ()=>{
const code = document.getElementById('code-area').value
const level = allLangLevels[currentLang][currentLevel]
const progress = progressMap[currentLang]
if(level.checkFunc(code)){
document.getElementById('output-area').innerHTML = `<div class="success">${i18n[currentUILang].passSuccess}</div>`
if(currentLevel+1 < allLangLevels[currentLang].length){
progress[currentLevel+1] = true
localStorage.setItem('multi_lang_learning_progress_bilingual', JSON.stringify(progressMap))
renderLevelNav()
refreshStats()
}
if(currentLevel === allLangLevels[currentLang].length -1){
document.getElementById('winModal').style.display = 'block'
}
}else{
document.getElementById('output-area').innerHTML = `<div class="error">${i18n[currentUILang].passFail}</div>`
}
}

document.getElementById('resetBtn').onclick = ()=>{
if(confirm(i18n[currentUILang].confirmReset)){
progressMap[currentLang] = new Array(52).fill(false).map((v,i)=>i===0)
localStorage.setItem('multi_lang_learning_progress_bilingual', JSON.stringify(progressMap))
renderLevelNav()
refreshStats()
openLevel(0)
}
}

document.getElementById('winConfirmBtn').onclick = ()=>{
document.getElementById('winModal').style.display='none'
}
</script>
</body>
</html>
